<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Arcade Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    </style>
</head>
<body>

    <div class="arcade-machine">
        
        <div class="marquee">
            <h1>WEB ARCADE</h1>
        </div>

        <div class="screen-container">
            <div class="screen">
                <h2>INSERT COIN...</h2>
                
                <div class="game-menu">
                    <button class="game-btn" onclick="location.href='card.html'">> 1. CARD MATCH</button>
                    <button class="game-btn" onclick="location.href='cookie.html'">> 2. COOKIE CLICKER</button>
                    <button class="game-btn" onclick="location.href='brick.html'">> 3. BRICK BREAKER</button>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="joystick"></div>
            <div class="action-buttons">
                <div class="action-btn blue"></div>
                <div class="action-btn green"></div>
                <div class="action-btn yellow"></div>
            </div>
        </div>

        <div class="footer-text">
            © 2026 FINAL PROJECT. CS DEPT.
        </div>

    </div>

</body>
</html>
