<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seowon's Portfolio - Windows XP</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="desktop">
      <div
        class="icon"
        ondblclick="
          requestNav('https://informationsecurityff.blogspot.com', '_blank')
        "
      >
        <div class="icon-img">🌐</div>
        <div class="icon-text">정보보안 및 IT.url</div>
      </div>

      <div
        class="icon"
        ondblclick="
          requestNav(
            'https://1drv.ms/p/c/04ae8d99431d5665/IQAKjosbDAiXS7u9Qr79YgRbAaLYT5s534R3_cnMa4WId3Q?e=Lzrmjm',
            '_blank',
          )
        "
      >
        <div class="icon-img">📊</div>
        <div class="icon-text">팀_프로젝트_발표.pptx</div>
      </div>

      <div
        class="icon"
        ondblclick="
          requestNav(
            'https://arcade-mikeseowonchos-projects.vercel.app',
            '_blank',
          )
        "
      >
        <div class="icon-img">🎮</div>
        <div class="icon-text">미니게임_천국.exe</div>
      </div>

      <div class="icon" ondblclick="requestNav('css1/index.html', 'href')">
        <div class="icon-img">📙</div>
        <div class="icon-text">포트폴리오1.exe</div>
      </div>

      <div
        class="icon"
        ondblclick="requestNav('groupproject/index.html', 'href')"
      >
        <div class="icon-img">📕</div>
        <div class="icon-text">포트폴리오2.exe</div>
      </div>

      <div class="icon" ondblclick="requestNav('ad/index.html', 'href')">
        <div class="icon-img">📚</div>
        <div class="icon-text">포트폴리오3.exe</div>
      </div>

      <div class="icon" ondblclick="requestNav('hcjdemo1/index.html', 'href')">
        <div class="icon-img">📖</div>
        <div class="icon-text">포트폴리오4.exe</div>
      </div>

      <div
        class="icon"
        ondblclick="requestNav('personalproject/index.html', 'href')"
      >
        <div class="icon-img">🎒</div>
        <div class="icon-text">포트폴리오5.exe</div>
      </div>
    </div>

    <div id="xp-confirm-overlay" class="confirm-overlay">
      <div class="xp-dialog">
        <div class="title-bar">
          <span>확인</span>
          <div class="close-btn" onclick="handleConfirm(false)">X</div>
        </div>
        <div class="content">
          <span class="icon-msg">❓</span>
          <div>윈도우 XP 창으로 이동하시겠습니까?</div>
        </div>
        <div class="buttons">
          <button onclick="handleConfirm(true)">확인</button>
          <button onclick="handleConfirm(false)">취소</button>
        </div>
      </div>
    </div>

    <script>
      let pendingURL = "";
      let pendingType = "";

      function requestNav(url, type) {
        pendingURL = url;
        pendingType = type;
        document.getElementById("xp-confirm-overlay").style.display = "block";
      }

      function handleConfirm(confirmed) {
        document.getElementById("xp-confirm-overlay").style.display = "none";
        if (confirmed && pendingURL) {
          if (pendingType === "_blank") {
            window.open(pendingURL, "_blank");
          } else {
            location.href = pendingURL;
          }
        }
        pendingURL = "";
        pendingType = "";
      }
    </script>
  </body>
</html>
