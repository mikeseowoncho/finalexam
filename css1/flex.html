<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        height: 400px;
        flex-direction: row-reverse;
        justify-content: space-between;
        align-items: center;
        background-color: dodgerblue;
        flex-wrap: wrap;
      }
      .container div {
        background-color: antiquewhite;
        width: 50px;
        margin: 10px;
        padding: 10px;
        text-align: center;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <h1>Flex layout</h1>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>
  </body>
</html>
