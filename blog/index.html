<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seowon's Portfolio - Windows XP</title>
    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <div class="desktop">
      <div class="icon" ondblclick="openWindow('blog-window')">
        <div class="icon-img">🌐</div>
        <div class="icon-text">블로그.url</div>
      </div>

      <div class="icon" ondblclick="openWindow('team-window')">
        <div class="icon-img">📊</div>
        <div class="icon-text">팀_프로젝트_발표.pptx</div>
      </div>

      <div class="icon" ondblclick="location.href = 'arcade/index.html'">
        <div class="icon-img">🎮</div>
        <div class="icon-text">미니게임_천국.exe</div>
      </div>

      <div class="icon" ondblclick="location.href = 'midterm/index.html'">
        <div class="icon-img">📗</div>
        <div class="icon-text">중간 과제.exe</div>
      </div>

      <div class="icon" ondblclick="location.href = 'css1/index.html'">
        <div class="icon-img">📙</div>
        <div class="icon-text">포트폴리오1.exe</div>
      </div>

      <div class="icon" ondblclick="location.href = 'groupproject/index.html'">
        <div class="icon-img">📕</div>
        <div class="icon-text">포트폴리오2.exe</div>
      </div>

      <div class="icon" ondblclick="location.href = 'ad/index.html'">
        <div class="icon-img">📚</div>
        <div class="icon-text">포트폴리오3.exe</div>
      </div>

      <div class="icon" ondblclick="location.href = 'hcjdemo1/index.html'">
        <div class="icon-img">📖</div>
        <div class="icon-text">포트폴리오4.exe</div>
      </div>

      <div
        class="icon"
        ondblclick="location.href = 'personalproject/index.html'"
      >
        <div class="icon-img">🎒</div>
        <div class="icon-text">포트폴리오5.exe</div>
      </div>
    </div>

    <div class="window" id="blog-window">
      <div class="title-bar">
        <span class="title-text">Internet Explorer - 블로그</span>
        <div class="close-btn" onclick="closeWindow('blog-window')">X</div>
      </div>
      <div class="window-content" style="text-align: center; padding: 20px">
        <p style="margin: 0 0 15px 0; color: #333; font-size: 14px">
          서원님의 개인 블로그로 이동하시겠습니까?
        </p>
        <button
          style="
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            background-color: #f0f0f0;
            border: 1px solid #adc2ec;
            border-radius: 3px;
          "
          onclick="location.href = 'blog/index.html'"
        >
          블로그 열기
        </button>
      </div>
    </div>

    <div class="window" id="team-window">
      <div class="title-bar">
        <span class="title-text">PowerPoint - 팀 프로젝트 기말 발표</span>
        <div class="close-btn" onclick="closeWindow('team-window')">X</div>
      </div>
      <div class="window-content"></div>
    </div>

    <script>
      function openWindow(id) {
        document.getElementById(id).style.display = "block";
      }
      function closeWindow(id) {
        document.getElementById(id).style.display = "none";
      }
    </script>
  </body>
</html>
